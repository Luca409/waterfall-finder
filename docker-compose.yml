services:
  waterfall-finder:
    build: .
    expose:
      - "8080"
    volumes:
      - waterfall-cache:/app/data/cache
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - waterfall-finder

volumes:
  waterfall-cache:
  caddy_data:
  caddy_config:
